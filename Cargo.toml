[package]
name = "slipnet-ech-relay"
version = "1.0.13"
edition = "2021"
rust-version = "1.79"
license = "MIT"
description = "ECH-preferred WebSocket relay with normal TLS fallback for SlipNet ParsPack routes"

[dependencies]
anyhow = "1.0"
axum = { version = "=0.7.9", features = ["ws"] }
futures-util = "0.3"
hickory-resolver = { version = "=0.24.4", default-features = false, features = ["tokio-runtime", "dns-over-https-rustls", "webpki-roots"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "logging", "std"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "=1.38.2", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-rustls = "0.26.6"
tokio-tungstenite = { version = "=0.24.0", default-features = false, features = ["handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
webpki-roots = "1"
